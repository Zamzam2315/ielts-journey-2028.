/* Layout: one column, phone first. Header with day counter, five views, fixed bottom tab bar.
   Motif: a passport stamped day by day. Navy ink, one stamp-orange accent. */
:root {
  --bg: #EDF0F5;
  --surface: #FFFFFF;
  --surface-2: #E3E8F0;
  --ink: #14213D;
  --muted: #55607A;
  --line: #CFD6E2;
  --accent: #D9481C;
  --accent-ink: #FFFFFF;
  --good: #1E7A4C;
  --bad: #B42318;
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1526; --surface: #16213A; --surface-2: #1F2D4B; --ink: #E8EDF7; --muted: #9BA8C4;
    --line: #2B3A5C; --accent: #FF8A5B; --accent-ink: #1A0E08; --good: #5FD398; --bad: #FF8A80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1526; --surface: #16213A; --surface-2: #1F2D4B; --ink: #E8EDF7; --muted: #9BA8C4;
  --line: #2B3A5C; --accent: #FF8A5B; --accent-ink: #1A0E08; --good: #5FD398; --bad: #FF8A80;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 16px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 96px;
  -webkit-text-size-adjust: 100%;
}
.wrap { max-width: 680px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.15; text-wrap: balance; margin: 0; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--f-mono); }
.label { font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* header */
header.top { padding-block: 22px 8px; display: grid; gap: 14px; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand h1 { font-size: 28px; font-weight: 700; letter-spacing: -.01em; }
.brand .year { font-family: var(--f-mono); font-size: 13px; color: var(--accent); font-weight: 500; }
.meter { display: grid; gap: 8px; }
.meter-row { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; flex-wrap: wrap; }
.bar { height: 10px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; width: 0; transition: width .4s ease; }
.sync { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }

/* views */
.view { display: none; padding-block: 12px 24px; gap: 16px; }
.view.on { display: grid; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.card h2 { font-size: 20px; }
.card h3 { font-size: 17px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }

/* tasks */
.task { display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: start; padding: 12px 0; border-top: 1px solid var(--line); min-width: 0; }
.task:first-of-type { border-top: 0; padding-top: 4px; }
.task input { width: 24px; height: 24px; margin: 2px 0 0; accent-color: var(--accent); }
.task .min { font-family: var(--f-mono); font-size: 12px; color: var(--accent); letter-spacing: .06em; }
.task p { overflow-wrap: anywhere; }
.task.done p { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.cmd { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; background: var(--surface-2); border-radius: 12px; padding: 12px; }
.cmd code { font-family: var(--f-mono); font-size: 14px; font-weight: 500; overflow-wrap: anywhere; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 14px; min-height: 44px; font-weight: 500; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn[disabled] { opacity: .5; cursor: default; }

/* word chips */
.words { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font-family: var(--f-mono); font-size: 14px; background: var(--surface-2); border-radius: 8px; padding: 6px 10px; }

/* plan list */
.week { display: grid; gap: 8px; }
.week-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.day { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; min-height: 64px; padding: 6px 2px; display: grid; justify-items: center; align-content: center; gap: 2px; }
.day .n { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.day .d { font-family: var(--f-display); font-weight: 700; font-size: 17px; }
.day .st { width: 22px; height: 22px; border-radius: 50%; border: 2px dashed var(--line); display: grid; place-items: center; font-size: 11px; font-weight: 700; }
.day.full .st { border: 2px solid var(--accent); color: var(--accent); transform: rotate(-8deg); }
.day.part .st { border: 2px solid var(--accent); border-style: dotted; }
.day.today { outline: 2px solid var(--ink); outline-offset: 1px; }
.day.sel { background: var(--surface-2); }
.day.rest .d { color: var(--muted); }

.sched-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 130px); gap: 10px; align-items: center; border-top: 1px solid var(--line); padding-top: 10px; }
.sched-row .form, .sched-row input { min-width: 0; }
/* flashcards */
.fc-wrap { display: grid; gap: 12px; }
.fc { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; min-height: 260px; padding: 22px 18px; display: grid; align-content: center; justify-items: start; gap: 12px; text-align: left; width: 100%; }
.fc .w { font-family: var(--f-display); font-weight: 700; font-size: 34px; overflow-wrap: anywhere; }
.fc .pos { font-family: var(--f-mono); font-size: 13px; color: var(--accent); }
.fc .ex { font-size: 17px; font-style: italic; overflow-wrap: anywhere; }
.fc .hint { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > * { flex: 1 1 120px; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { flex: 1 1 auto; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 8px 14px; min-height: 40px; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.form { display: grid; gap: 10px; }
.form label { display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
.form input, .form textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 44px; width: 100%; }

/* quiz */
.opts { display: grid; gap: 8px; }
.opt { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px; min-height: 48px; overflow-wrap: anywhere; }
.opt.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--surface)); }
.opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, var(--surface)); }
.q { font-size: 18px; font-weight: 500; overflow-wrap: anywhere; }
.exp { border-left: 3px solid var(--accent); padding-left: 12px; }
.score { font-family: var(--f-display); font-size: 48px; font-weight: 700; line-height: 1; }

/* stats */
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.stat { background: var(--surface-2); border-radius: 12px; padding: 12px; display: grid; gap: 2px; }
.stat b { font-family: var(--f-display); font-size: 30px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.hist { display: grid; gap: 6px; font-size: 14px; }
.hist div { display: flex; justify-content: space-between; gap: 10px; border-top: 1px solid var(--line); padding-top: 6px; font-variant-numeric: tabular-nums; }

/* tab bar */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--surface); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(5, 1fr);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
}
nav.tabs a { text-decoration: none; color: var(--muted); display: grid; justify-items: center; gap: 2px; padding: 6px 2px; border-radius: 10px; font-size: 12px; min-height: 48px; align-content: center; }
nav.tabs a svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
nav.tabs a[aria-current="page"] { color: var(--accent); font-weight: 600; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 99px; font-size: 14px; z-index: 30; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style>

function lessonFor(day) {

    return {day:day, week:3, dow:dow, title: day === 29 ? "Review besar bulan pertama" : "Penutup dan laporan bulanan",
      min:[20,25,15],
      tasks: day === 29

      cmd: day === 29 ? "ULANGI MATERI" : "MONTHLY REPORT", rest:false};
  }
  var out = {day:day, week:w, dow:dow, min:[20,25,15], rest:false};
  if (dow === 0) { var g = GRAM[w]; out.title = "Grammar: " + g.t; out.tasks = [g.a, g.b, g.c]; out.cmd = "MULAI BELAJAR"; }
  else if (dow === 1) { var l = LIST[w]; out.title = l.t; out.tasks = [l.a, l.b, l.c]; out.cmd = "LATIHAN LISTENING"; }
  else if (dow === 2) { var r = READ[w]; out.title = r.t; out.tasks = [r.a, r.b, r.c]; out.cmd = "LATIHAN READING"; }
  else if (dow === 3) { var s = SPEAK[w]; out.title = s.t; out.tasks = [s.a, s.b, s.c]; out.cmd = "LATIHAN SPEAKING"; }

  else { out.title = "Istirahat"; out.tasks = SUN; out.cmd = ""; out.rest = true; }
  return out;
}
function dateOf(day) { var d = new Date(START.getTime()); d.setDate(d.getDate() + day - 1); return d; }

/* ---------- Helpers ---------- */
var $ = function (id) { return document.getElementById(id); };
function el(tag, attrs, kids) {
  var n = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(function (k) {
    if (attrs[k] === null || attrs[k] === undefined) return;
    if (k === "text") n.textContent = attrs[k];
    else if (k === "class") n.className = attrs[k];
    else if (k.slice(0,2) === "on") n.addEventListener(k.slice(2), attrs[k]);
    else n.setAttribute(k, attrs[k]);
  });
  (kids || []).forEach(function (c) { if (c) n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
  return n;
}

var toastTimer;

function copyText(txt) {
  try {
    navigator.clipboard.writeText(txt).then(function () { toast("Disalin: " + txt); }, function () { fallbackCopy(txt); });
  } catch (e) { fallbackCopy(txt); }
}
function fallbackCopy(txt) {
  var ta = el("textarea", {"aria-hidden":"true"}); ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select();
  var ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
  document.body.removeChild(ta); toast(ok ? "Disalin: " + txt : "Salin manual: " + txt);
}
function speak(text) {
  try {
    if (!("speechSynthesis" in window)) { toast("Suara tidak tersedia di browser ini."); return; }
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text); u.lang = "en-GB"; u.rate = 0.9;

}
function dayStatus(day) {

function streak() {
  var d = new Date(); d.setHours(0,0,0,0);
  var s = 0, guard = 0;
  if (!state.log[iso(d)]) d.setDate(d.getDate() - 1);
  while (guard++ < 400) {
    var wd = (d.getDay() + 6) % 7; // 0=Senin
    if (state.log[iso(d)]) s++;
    else if (wd !== 6) break;

  }
  return s;
}

}

/* ---------- View: Kartu ---------- */
var fc = {filter:"belum", idx:0, flipped:false, order:[]};

        el("button", {class:"btn primary", type:"button", text:"Hafal", onclick:function(){ state.cards[c.w] = Math.min(3, cardLevel(c.w) + 2); logToday(); save(); if (fc.filter === "belum") { if (fc.idx >= list.length - 1) fc.idx = 0; } else fc.idx = (fc.idx + 1) % list.length; fc.flipped = false; renderCards(); }})

/* ---------- View: Kuis ---------- */
var qz = {mode:null, tag:"Semua", items:[], i:0, score:0, answered:false, picked:-1, wrong:[]};
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function buildVocabQ(kind) {
  var all = allCards().filter(function (c) { return c.pos !== "baru" || c.id; });
  return shuffle(all).slice(0, 10).map(function (c) {
    var others = shuffle(all.filter(function (x) { return x.w !== c.w; })).slice(0, 3);
    if (kind === "arti") {
      var opts = shuffle([c].concat(others));
      return {q:"Apa arti \"" + c.w + "\"?", o:opts.map(function (x) { return x.id; }), a:opts.indexOf(c), e:c.w + " = " + c.id + ". Contoh: " + c.ex};
    }
    var esc = function (s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); };
    var withEx = all.filter(function (x) { return x.ex && x.ex !== "-" && new RegExp("\\b" + esc(x.w) + "\\b", "i").test(x.ex); });
    var cc = withEx.length ? withEx[Math.floor(Math.random() * withEx.length)] : c;
    var oth = shuffle(withEx.filter(function (x) { return x.w !== cc.w; })).slice(0, 3);
    var ops = shuffle([cc].concat(oth));
    var re = new RegExp("\\b" + esc(cc.w) + "\\b", "i");
    return {q:cc.ex.replace(re, "______"), o:ops.map(function (x) { return x.w; }), a:ops.indexOf(cc), e:"Jawaban: " + cc.w + " (" + cc.id + ")."};
  });
}
function startQuiz(mode) {

  if (mode === "grammar") {
    var pool = GQ.filter(function (q) { return qz.tag === "Semua" || q.tag === qz.tag; });
    qz.items = shuffle(pool).slice(0, 10);
  } else qz.items = buildVocabQ(mode);
  renderQuiz();
}
function renderQuiz() {
  var root = $("v-kuis"); clear(root);
  if (!qz.mode) {
    root.appendChild(el("div", {class:"card"}, [
      el("h2", {text:"Kuis"}),
      el("p", {class:"small muted", text:"10 soal per sesi. Setiap jawaban dibahas, jadi salah itu berguna."})
    ]));
    var tagBtns = el("div", {class:"seg", role:"group", "aria-label":"Topik grammar"}, GTAGS.map(function (t) {
      return el("button", {type:"button", text:t, "aria-pressed": String(qz.tag === t), onclick:function(){ qz.tag = t; renderQuiz(); }});
    }));
    root.appendChild(el("div", {class:"card"}, [el("h3", {text:"Grammar"}), tagBtns, el("button", {class:"btn primary", type:"button", text:"Mulai kuis grammar", onclick:function(){ startQuiz("grammar"); }})]));
    root.appendChild(el("div", {class:"card"}, [el("h3", {text:"Vocabulary"}), el("p", {class:"small muted", text:"Dari " + allCards().length + " kata di flashcard."}), el("div", {class:"row"}, [
      el("button", {class:"btn", type:"button", text:"Kata ke arti", onclick:function(){ startQuiz("arti"); }}),
      el("button", {class:"btn", type:"button", text:"Isi kalimat", onclick:function(){ startQuiz("kalimat"); }})
    ])]));
    return;
  }
  if (!qz.items.length) { qz.mode = null; renderQuiz(); return; }
  if (qz.i >= qz.items.length) {
    var total = qz.items.length;
    state.quiz.push({d:iso(new Date()), m:qz.mode === "grammar" ? "Grammar " + qz.tag : (qz.mode === "arti" ? "Vocab arti" : "Vocab kalimat"), s:qz.score, t:total});
    if (state.quiz.length > 60) state.quiz = state.quiz.slice(-60);
    logToday(); save();
    root.appendChild(el("div", {class:"card"}, [
      el("span", {class:"label", text:"Selesai"}),
      el("div", {class:"score", text: qz.score + "/" + total}),
      el("p", {text: qz.score === total ? "Sempurna. Coba topik lain atau kuis campuran." : "Soal yang salah tercatat di bawah. Baca penjelasannya sekali, lalu ulangi kuis."})
    ]));
    if (qz.wrong.length) {
      var wc = el("div", {class:"card"}, [el("h3", {text:"Untuk dipelajari ulang"})]);
      qz.wrong.forEach(function (q) { wc.appendChild(el("div", {class:"exp"}, [el("p", {class:"q", text:q.q}), el("p", {class:"small", text:"Benar: " + q.o[q.a]}), el("p", {class:"small muted", text:q.e})])); });

    card.appendChild(el("button", {class:"btn primary", type:"button", text: qz.i + 1 >= qz.items.length ? "Lihat skor" : "Soal berikutnya", onclick:function(){ qz.i++; qz.answered = false; qz.picked = -1; renderQuiz(); }}));
  }

  root.appendChild(el("button", {class:"btn ghost", type:"button", text:"Hentikan kuis", onclick:function(){ qz.mode = null; renderQuiz(); }}));
}

/* ---------- View: Progres ---------- */
function renderProgress() {

  var done = 0, tasksDone = 0;

  var known = allCards().filter(function (c) { return cardLevel(c.w) >= 2; }).length;

function evalForm() {
  var f = el("form", {class:"form"}, [
    el("label", {for:"ev-w"}, ["Minggu ke", el("input", {id:"ev-w", type:"number", min:"1", max:"4", inputmode:"numeric"})]),
    el("label", {for:"ev-s"}, ["Skor total (0-100)", el("input", {id:"ev-s", type:"number", min:"0", max:"100", inputmode:"numeric"})]),

/* ---------- Router ---------- */
var VIEWS = ["hari-ini","rencana","kartu","kuis","progres"];
function route() {
  var h = (location.hash || "").replace("#", "");
  if (VIEWS.indexOf(h) < 0) h = "hari-ini";
  VIEWS.forEach(function (v) { $("v-" + v).classList.toggle("on", v === h); });
  document.querySelectorAll("nav.tabs a").forEach(function (a) { if (a.getAttribute("data-v") === h) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  if (h === "hari-ini") renderToday();
  if (h === "rencana") renderPlan();
  if (h === "kartu") renderCards();
  if (h === "kuis") renderQuiz();
  if (h === "progres") renderProgress();
  paintHeader();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);

/* ---------- Boot ---------- */
loadLocal();
viewDay = Math.min(Math.max(todayDay(), 1), TOTAL);

/* Sinkron ke akun (opsional). Halaman tetap berjalan tanpa ini. */
(function () {
  if (!(window.claude && window.claude.use)) return;
  Promise.all([window.claude.use("user"), window.claude.use("db")]).then(function (r) {
    var user = r[0], db = r[1];
    if (!user || !db) return null;
    return user.id().then(function (id) {
      if (!id) return null;
      dbDoc = db.doc("data/users/" + id + "/progress");
      return dbDoc.get();
    });
  }).then(function (snap) {
    if (!dbDoc) return;
    if (snap && snap.exists) {
      try {
        var remote = JSON.parse(snap.data().state);
        var rUp = snap.data().updated || 0;
        if (rUp > (state.updated || 0)) { state = Object.assign({checks:{}, log:{}, cards:{}, quiz:[], extra:[], updated:0}, remote); try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} route(); }
        else if ((state.updated || 0) > rUp) pushDb();
      } catch (e) {}
    } else if (state.updated) pushDb();
    dbMode = "db"; paintSync();
  }).catch(function () { dbMode = "local"; paintSync(); });
})();
